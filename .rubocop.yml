require:
  - rubocop-rspec
AllCops:
  NewCops: enable
  TargetRubyVersion: 4.0.0
Style/StringLiterals:
  EnforcedStyle: double_quotes
RSpec/DescribeClass:
  Enabled: false
RSpec/MultipleExpectations:
  Enabled: false
RSpec/ExampleLength:
  Enabled: false
RSpec/NestedGroups:
  Enabled: false
Style/NestedModifier:
  Enabled: false
RSpec/Output:
  Enabled: false
RSpec/ExpectInHook:
  Enabled: false
